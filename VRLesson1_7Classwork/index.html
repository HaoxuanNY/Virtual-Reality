<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>

      <a-entity id="blue-ghost" position="-1 0 -3.5">
        <a-sphere position="0 0.75 0" radius="0.5" color="#36c9f4"></a-sphere>
        <a-cylinder position="0 0.4 0" radius="0.5" height="0.55" color="#36c9f4"></a-cylinder>
        <a-sphere position="-0.3 0 0" radius="0.2" color="#36c9f4"></a-sphere>
        <a-sphere position="0 0 0" radius="0.2" color="#36c9f4"></a-sphere>
        <a-sphere position="0.3 0 0" radius="0.2" color="#36c9f4"></a-sphere>
        <a-sphere position="-0.2 1 0.4" radius="0.15" color="white"></a-sphere>
        <a-sphere position="0.2 1 0.4" radius="0.15" color="white"></a-sphere>
        <a-sphere position="-0.15 1 0.5" radius="0.07" color="#17234a"></a-sphere>
        <a-sphere position="0.2 1 0.5" radius="0.07" color="#17234a"></a-sphere>
      </a-entity>

      <a-entity id="red-ghost" position="1 0 -3.5">
        <a-sphere position="0 0.75 0" radius="0.5" color="#f46236"></a-sphere>
        <a-cylinder position="0 0.4 0" radius="0.5" height="0.55" color="#f46236"></a-cylinder>
        <a-sphere position="-0.3 0 0" radius="0.2" color="#f46236"></a-sphere>
        <a-sphere position="0 0 0" radius="0.2" color="#f46236"></a-sphere>
        <a-sphere position="0.3 0 0" radius="0.2" color="#f46236"></a-sphere>
        <a-sphere position="-0.2 1 0.4" radius="0.15" color="white"></a-sphere>
        <a-sphere position="0.2 1 0.4" radius="0.15" color="white"></a-sphere>
        <a-sphere position="-0.15 1 0.5" radius="0.07" color="#17234a"></a-sphere>
        <a-sphere position="0.2 1 0.5" radius="0.07" color="#17234a"></a-sphere>
      </a-entity>

    </a-scene>
  </body>
</html>

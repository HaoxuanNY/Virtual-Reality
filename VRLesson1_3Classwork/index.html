<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="grass" src="texture_grass.jpeg">
        <img id="sky" src="sky1.jpeg">
      </a-assets>
      <!-- Task 1: Using the color attribute make the following tree look better -->
      <a-sphere position="0 4 -5" radius="1.25" color="#2E8B57"></a-sphere>
      <a-sphere position="-1 3 -5" radius="1.25" color="#2E8B57"></a-sphere>
      <a-sphere position="1 3 -5" radius="1.25" color="#2E8B57"></a-sphere>
      <a-cylinder position="0 0.75 -5" radius="0.5" height="3.5" color="#8b5a2b"></a-cylinder>

     <!-- Task 2: Using one of the texture images make the plane look like the ground.  Don't forget to repeat the image if it looks blurred. -->
       <a-plane position="0 0 -4" rotation="-90 0 0" width="50" height="50" src="#grass" repeat="20 20"></a-plane>

      <!-- Task 3: Using either the sky or bk images, change the sky component -->
      <a-sky src="#sky"></a-sky>
    </a-scene>
  </body>
</html>
